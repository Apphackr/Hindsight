<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7C86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hindsight">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Hindsight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#F5F6F3; --ink:#1B1F24; --ink-2:#5C6470; --ink-3:#8B93A0;
  --line:#E4E7E2; --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#E3F3F4;
  --ai:#4F5BD5; --ai-soft:#EEF0FD; --ai-ink:#3A44A8;
  --com:#2F7D4E; --com-soft:#E8F4EC; --com-ink:#22633B;
  --warn:#B9791A; --warn-soft:#FBF1DE; --bad:#C0453A; --bad-soft:#FBE9E7;
  --exp:#8A5A00; --exp-soft:#FFF1D2;
  --radius:16px; --shadow:0 1px 2px rgba(20,24,30,.05),0 8px 24px rgba(20,24,30,.06);
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--surface);position:relative}
.screen{padding:20px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.screen.no-tab{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.hello{font-size:30px;line-height:1.1;margin:4px 0 16px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.hint{font-size:12px;color:var(--ink-3)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:520px;margin:0 auto;display:flex;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);width:72px;padding:4px 0}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink);transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.outline.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}
.link{color:var(--accent);font-weight:600;font-size:13px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:500;font-size:14px}
.back.light{color:rgba(255,255,255,.92)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);color:#fff}
/* forms */
.field{margin-bottom:14px}
.field>label,.lab{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input,.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:16px}
.field textarea{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{padding:6px 8px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:12px;border-radius:14px;border:1.5px solid var(--line);text-align:left;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;background:var(--surface)}
.opt .em{font-size:20px}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.q{margin-bottom:22px}
.q>h2{font-size:18px;margin-bottom:4px}
.q>.sub{font-size:13px;color:var(--ink-2);margin-bottom:10px}
.q>h2+.chips,.q>h2+.seg,.q>h2+.grid2,.q>h2+.input,.q>h2+.row2{margin-top:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
/* onboarding */
.progress{display:flex;gap:6px;margin-bottom:24px}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--accent)}
.ob-title{font-size:28px;line-height:1.15;margin-bottom:6px}
.ob-sub{color:var(--ink-2);margin-bottom:20px}
.ob-footer{margin-top:24px;display:flex;gap:10px}
.ob-footer .btn{flex:1}
.logo{width:72px;height:72px;border-radius:22px;background:var(--accent);margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.lang-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lang-row .seg{flex:0 0 210px}
/* home */
.search-bar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:24px;color:var(--ink-2);text-align:left;width:100%}
.search-bar b{color:var(--ink);display:block;font-size:14px}
.search-bar span{font-size:13px}
.section{margin-bottom:28px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-h h2{font-size:20px}
.trip-card{display:block;width:100%;text-align:left;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:12px}
.trip-cover{height:128px;position:relative;display:flex;align-items:flex-end;padding:14px;color:#fff}
.trip-cover h3{font-size:22px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.trip-cover .sub{color:rgba(255,255,255,.92);font-size:13px}
.trip-cover .tl{position:absolute;top:12px;left:12px}
.trip-cover .tr{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);color:#1B1F24;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.trip-body{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2)}
.trip-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.trip-row .sw{width:44px;height:44px;border-radius:12px;flex:0 0 auto}
.trip-row b{display:block}
.trip-row span{font-size:12px;color:var(--ink-3)}
.tile-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:14px;background:var(--surface-2);text-align:left}
.tile .n{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--ink-2);margin-top:4px}
.nudge{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;margin-bottom:8px;background:var(--accent-soft);width:100%;text-align:left}
.nudge.warn{background:var(--warn-soft)}
.nudge.ai{background:var(--ai-soft)}
.nudge .em{font-size:22px;flex:0 0 auto}
.nudge b{display:block;font-size:14px}
.nudge span{font-size:13px;color:var(--ink-2)}
.empty{padding:22px 16px;border:1.5px dashed var(--line);border-radius:var(--radius);text-align:center;color:var(--ink-2);font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.ai{background:var(--ai-soft);color:var(--ai-ink)}
.badge.com{background:var(--com-soft);color:var(--com-ink)}
.badge.me{background:var(--accent-soft);color:var(--accent)}
.badge.exp{background:var(--exp-soft);color:var(--exp)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.plain{background:var(--surface-2);color:var(--ink-2)}
.badge.light{background:rgba(255,255,255,.92);color:#1B1F24}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.Planning{background:var(--surface-2);color:var(--ink-2)}
.st.Booking{background:var(--ai-soft);color:var(--ai-ink)}
.st.Booked{background:var(--accent-soft);color:var(--accent)}
.st.Away{background:var(--com-soft);color:var(--com-ink)}
.st.Just.back,.st.Justback{background:var(--exp-soft);color:var(--exp)}
.st.Past{background:var(--surface-2);color:var(--ink-3)}
/* trip */
.hero{margin:-20px -16px 0;padding:16px 16px 18px;color:#fff}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero h1{font-size:34px;line-height:1.05;margin-top:18px}
.hero .meta{margin-top:8px;font-size:14px;color:rgba(255,255,255,.94);display:flex;gap:14px;flex-wrap:wrap}
.hero .meta span{display:inline-flex;align-items:center;gap:5px}
.hero .meta svg.i{width:15px;height:15px}
.purpose{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.purpose span{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.purpose span.main{background:#fff;color:#1B1F24;border-color:#fff}
.status-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 4px;font-size:13px;color:var(--ink-2)}
.tv-bar{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);margin:8px -16px 16px;padding:0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:6}
.tv-nav{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tv-nav::-webkit-scrollbar{display:none}
.tv-nav button{flex:0 0 auto;padding:13px 10px;font-weight:600;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tv-nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tv-nav .ct{font-size:11px;background:var(--surface-2);color:var(--ink-2);padding:1px 6px;border-radius:999px;margin-left:4px;font-variant-numeric:tabular-nums}
.ask-fab{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:7px 12px;border-radius:999px;background:var(--ai-soft);color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;margin:8px 0}
.qs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.qs::-webkit-scrollbar{display:none}
.qs button{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.ai-card{border-left:3px solid var(--ai)}
.card.com-card{border-left:3px solid var(--com)}
.card.me-card{border-left:3px solid var(--accent)}
.card h3{font-size:17px;margin-bottom:6px;line-height:1.25}
.card p{color:var(--ink-2);font-size:14px}
.card .why{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.card .why b{color:var(--ink)}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-weight:500}
.sec{margin-bottom:22px;scroll-margin-top:60px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-h h2{font-size:19px;display:flex;gap:8px;align-items:center}
.mini{font-size:12px;font-weight:600;color:var(--ink-3);padding:6px 8px;border-radius:8px}
.official{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.official a{font-weight:600;text-decoration:none}
.sources{font-size:12px;color:var(--ink-3)}
.sources a{display:block;color:var(--ink-2);text-decoration:none;padding:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spinner{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite;vertical-align:-3px}
.spinner.dark{border-color:var(--ai-soft);border-top-color:var(--ai)}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{padding:10px 12px;border-radius:14px;font-size:14px;margin-bottom:8px;max-width:92%}
.bubble.me{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bubble.ai{background:var(--ai-soft);color:var(--ink);border-bottom-left-radius:4px}
.bubble p+p,.bubble ul+p,.bubble p+ul{margin-top:6px}
.bubble ul{margin:0;padding-left:18px}
.ask-row{display:flex;gap:8px;margin-top:6px}
.ask-row input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0}
/* saved / items */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--surface-2);flex:0 0 auto}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14px}
.item .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.item .d{font-size:13px;color:var(--ink-2);margin-top:3px}
.item .x{color:var(--ink-3);font-size:18px;padding:0 4px;line-height:1}
.item[data-act]{cursor:pointer}
.item .chev{color:var(--ink-3);font-size:18px;flex:0 0 auto;align-self:center}
.swipe{position:relative;overflow:hidden;border-radius:var(--radius);margin-bottom:12px}
.swipe .card{margin-bottom:0;border-radius:var(--radius)}
.swipe-del{position:absolute;inset:0;background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:26px;font-weight:700;font-size:14px}
.swipe-body{position:relative;background:var(--bg);touch-action:pan-y}
.swipe-body.anim{transition:transform .18s ease}
.rate{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rate button{padding:6px 10px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;font-weight:600}
.rate button.on{border-color:var(--com);background:var(--com-soft);color:var(--com-ink)}
.group-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:16px 0 2px}
/* bookings */
.booking .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;padding-left:8px;white-space:nowrap}
.spend-total{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 12px;gap:10px}
.spend-total .n{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.spend-row{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.spend-row .bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.spend-row .bar span{display:block;height:100%;border-radius:5px;background:var(--accent)}
.spend-row .bar span.est{background:repeating-linear-gradient(45deg,var(--accent) 0 4px,var(--accent-soft) 4px 8px)}
.spend-row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.review-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.review-item:first-child{border-top:0}
.mk{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.mk.ok{background:var(--com-soft);color:var(--com-ink)}
.mk.warn{background:var(--warn-soft);color:var(--warn)}
.review-item b{display:block}
.review-item span{color:var(--ink-2);font-size:13px}
.score{display:flex;align-items:baseline;gap:6px;margin:8px 0 4px}
.score .n{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1}
/* checklist */
.cl-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.cl-item .box{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:1px}
.cl-item.done .box{background:var(--accent);border-color:var(--accent)}
.cl-item.done .box::after{content:"";width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.cl-item .t{font-size:14px;font-weight:500}
.cl-item.done .t{color:var(--ink-3);text-decoration:line-through}
.cl-item .why{font-size:12px;color:var(--ink-3);margin-top:2px}
.cl-item .body{flex:1}
.lvl{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.lvl span{display:block;height:100%;background:var(--accent);border-radius:4px}
/* photos */
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img,.thumbs .add{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.thumbs .add{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);color:var(--ink-3);font-size:22px;cursor:pointer}
.thumb-wrap{position:relative}
.thumb-wrap button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;line-height:1}
/* profile */
.profile-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:26px;font-weight:600;flex:0 0 auto}
.profile-head h1{font-size:24px}
.flag{padding:8px 11px;border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.flag small{color:var(--ink-3);font-weight:400}
.exp-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);margin-bottom:8px}
.exp-card .medal{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;border:2px solid var(--line);background:var(--surface)}
.exp-card .medal.Regular{border-color:var(--accent)}
.exp-card .medal.Expert{border-color:var(--exp);background:var(--exp-soft)}
.exp-card .body{flex:1;min-width:0}
.exp-card .t{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.exp-card .s{font-size:12px;color:var(--ink-2)}
.exp-card .lvl{height:5px;margin-top:6px}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.wish{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);margin-bottom:8px;align-items:flex-start}
.wish .sw{width:48px;height:48px;border-radius:12px;flex:0 0 auto}
.wish .body{flex:1;min-width:0}
.wish .t{font-weight:600}
.wish .why{font-size:13px;color:var(--ink-2)}
.wish .best{font-size:13px;margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--ai-soft);color:var(--ink)}
/* sheet + toast */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:22px;margin-bottom:4px}
.sheet .sub{color:var(--ink-2);font-size:14px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.preview{white-space:pre-wrap;padding:12px 14px;border-radius:14px;background:var(--com-soft);font-size:14px;color:var(--ink)}
.links{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.lnk{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:2px 0}
button.lnk{font:inherit;font-size:13px;font-weight:600;color:var(--accent)}
.getting{font-size:13px;color:var(--ink);margin-top:8px}
.chat-recs{margin:0 0 12px}
.chat-recs .group-h{margin-top:4px}
.rec-card{margin-bottom:10px}
.rec-card h3{font-size:15px}
.rec-card .foot .s{font-size:12px;color:var(--ink-3)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

const DB={db:null,
  open(){return new Promise((res,rej)=>{if(!('indexedDB' in window))return rej(new Error('no idb'));const r=indexedDB.open('wayfarer',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos');};r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  req(store,mode,fn){return new Promise((res,rej)=>{const tx=this.db.transaction(store,mode);const r=fn(tx.objectStore(store));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});},
  get(s,k){return this.req(s,'readonly',o=>o.get(k));},
  put(s,k,v){return this.req(s,'readwrite',o=>o.put(v,k));},
  del(s,k){return this.req(s,'readwrite',o=>o.delete(k));},
  clear(s){return this.req(s,'readwrite',o=>o.clear());},
  entries(s){return new Promise((res,rej)=>{const out=[];const tx=this.db.transaction(s,'readonly');const c=tx.objectStore(s).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue();}};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);});}
};
const defaults=()=>({v:1,profile:{name:'',home:'',styles:[],regions:[],stay:'No preference',langs:{},onboarded:false},countries:{},trips:[],wishlist:[],settings:{apiKey:'',model:'claude-sonnet-5',webSearch:true,lastExport:'',notify:false}});
let S=defaults();
function normalize(s){
  const d=defaults();const o=Object.assign(d,s||{});
  o.profile=Object.assign(defaults().profile,o.profile||{});
  o.settings=Object.assign(defaults().settings,o.settings||{});
  o.trips=(o.trips||[]).map(t=>Object.assign({saved:[],bookings:[],log:[],chat:[],extras:[],checklist:null,plan:null,itinerary:null,review:null,statusOverride:'',budgetAmount:'',base:null,travelExtras:{lounge:'',parking:''},notifiedDays:[],checklistNotifiedAt:''},t));
  o.wishlist=o.wishlist||[];o.countries=o.countries||{};
  // older versions stored past visits inside the country — turn them into past trips
  for(const [c,v] of Object.entries(o.countries)){
    for(const x of (v&&v.visits)||[])o.trips.push(pastTrip(c,x.city||cName(c),{whenText:x.when||'',notes:[x.stay?'Stayed: '+x.stay:'',x.notes||''].filter(Boolean).join('\n')}));
    o.countries[c]={};
  }
  return o;
}

const purl={};
function shrink(file,max=1400,q=.8){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Could not read that photo')),'image/jpeg',q);};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read that photo'));};img.src=u;});}
async function storePhotos(files){const ids=[];for(const f of files){try{const b=await shrink(f);const id='p'+uid();await DB.put('photos',id,b);ids.push(id);}catch(e){toast(e.message);}}return ids;}
async function fillPhotos(){for(const el of $$('img[data-photo]')){const id=el.dataset.photo;if(!purl[id]&&DB.db){const b=await DB.get('photos',id).catch(()=>null);if(b)purl[id]=URL.createObjectURL(b);}if(purl[id])el.src=purl[id];}}
async function dropPhotos(ids){for(const id of ids||[]){try{await DB.del('photos',id);}catch(_){}if(purl[id]){URL.revokeObjectURL(purl[id]);delete purl[id];}}}

function pastTrip(c,place,extra={}){return {id:uid(),created:new Date().toISOString(),kind:'past',dest:place,country:c,datesKnown:false,from:'',to:'',when:'',whenText:'',nights:'',season:'',who:'',adults:0,kids:0,occasion:'',main:'',extras:[],budget:'',stay:'',origin:'',event:'',notes:'',plan:null,saved:[],bookings:[],checklist:null,log:[],chat:[],review:null,statusOverride:'',budgetAmount:'',...extra};}
const endKey=t=>t.kind==='past'?(t.when?t.when+'-28':'0000'):((t.to||t.from)||'0000');
function whenLabel(t){if(t.when){const [y,m]=t.when.split('-').map(Number);return `${MONL[m-1]} ${y}`;}return t.whenText||'';}
function whoLabel(t){const a=Number(t.adults)||0,k=Number(t.kids)||0;if(t.kind==='past')return t.who==='Partner'?'With partner':t.who||'';if(t.who==='Solo')return 'Solo';if(t.who==='Partner')return 'You + partner';if(t.who==='Family with kids')return `${a} adult${a===1?'':'s'}, ${k} kid${k===1?'':'s'}`;return `${t.who} · ${a+k}`;}
function dateLabel(t){if(t.kind==='past'){const w=whenLabel(t);return (w||'Date not added')+(t.nights?` · ${t.nights} night${t.nights==1?'':'s'}`:'');}return t.datesKnown&&t.from?fmtRange(t.from,t.to):('Dates TBC'+(t.season&&t.season!=='Flexible'?' · '+t.season:''));}
function status(t){return t.statusOverride||autoStatus(t);}
function autoStatus(t){
  if(t.kind==='past')return 'Past';
  const td=today();if(!t.datesKnown||!t.from)return 'Planning';
  const end=t.to||t.from;
  if(t.from<=td&&td<=end)return 'Away';
  if(end<td)return daysBetween(end,td)<=14?'Just back':'Past';
  return t.bookings.length?'Booked':'Planning';
}
const stCls=s=>'st '+s.replace(/\s/g,'');
const isPast=t=>t.kind==='past'||!!(t.datesKnown&&t.from&&(t.to||t.from)<today());
const isNow=t=>{const td=today();return t.kind!=='past'&&!!(t.datesKnown&&t.from&&t.from<=td&&td<=(t.to||t.from));};
const started=t=>t.datesKnown&&t.from&&t.from<=today();
function visited(){const s=new Set(Object.keys(S.countries));for(const t of S.trips)if(t.country&&isPast(t))s.add(t.country);return [...s];}
const logCount=()=>S.trips.reduce((a,t)=>a+t.log.length,0);
function points(){let p=0;for(const t of S.trips){for(const l of t.log){p+=5;if(l.photos&&l.photos.length)p+=5;}p+=15*t.saved.filter(s=>s.state).length;}p+=10*visited().length;return p;}
function rank(p){return p<100?['Newcomer',100]:p<300?['Explorer',300]:p<800?['Trailblazer',800]:['Globetrotter',null];}
function experts(){
  const m={};
  for(const c of visited()){const ts=S.trips.filter(t=>t.country===c);m[c]={trips:Math.max(1,ts.filter(isPast).length),recs:ts.reduce((a,t)=>a+t.log.length,0)};}
  return Object.entries(m).map(([c,x])=>{const level=x.trips>=5&&x.recs>=10?'Expert':(x.trips>=3||x.recs>=5)?'Regular':'Visitor';
    const prog=level==='Expert'?1:level==='Regular'?(Math.min(x.trips,5)/5+Math.min(x.recs,10)/10)/2:Math.max(x.trips/3,x.recs/5);
    const next=level==='Visitor'?`${Math.max(0,3-x.trips)} more trip${3-x.trips===1?'':'s'} or ${Math.max(0,5-x.recs)} more logged places to Regular`:level==='Regular'?`To Expert: 5 trips and 10 logged places`:'Top level';
    return {c,...x,level,prog:Math.min(1,prog),next};}).sort((a,b)=>(b.trips*2+b.recs)-(a.trips*2+a.recs));
}
function checkins(){
  const out=[];const td=today();
  for(const t of S.trips){
    if(t.kind==='past')continue;
    if(isNow(t))out.push({k:'now',t});
    else if(isPast(t)&&daysBetween(t.to||t.from,td)<=45){const open=t.saved.filter(s=>!s.state);if(open.length)out.push({k:'loop',t,n:open.length});else if(!t.log.length)out.push({k:'log',t});}
    for(const b of t.bookings)if(b.cancelBy&&b.cancelBy>=td&&daysBetween(td,b.cancelBy)<=14)out.push({k:'cancel',t,b});
    if(t.datesKnown&&t.from&&t.from>td&&daysBetween(td,t.from)<=10&&!t.checklist)out.push({k:'check',t});
  }
  if(S.trips.length&&S.settings.apiKey===''&&!out.length)out.push({k:'key'});
  const last=S.settings.lastExport;
  if((S.trips.length>1||logCount()>3)&&(!last||daysBetween(last,td)>30))out.push({k:'backup'});
  return out;
}

const SYS=`You are the planning assistant inside Hindsight, a personal travel app whose promise is "travel with hindsight" — advice as if from someone who has already been. Give specific, practical, honest advice tailored to this traveller and this trip — not generic lists. The traveller is UK-based: use GBP for prices and UK government (FCDO) travel advice for safety and entry rules. Never invent laws, statistics, opening times or places; if you are not confident a specific place exists, describe the kind of place instead. When asked for JSON, reply with only valid JSON — no markdown fences, no commentary.`;
function ctxProfile(){const p=S.profile;const langs=Object.entries(p.langs||{}).filter(([,v])=>v).map(([l,v])=>`${l} (${v==='speak'?'speaks':'learning'})`).join(', ');
  const fl=S.trips.flatMap(t=>t.log.filter(l=>l.type==='Flight'||l.type==='Airport').map(l=>`${l.name}${l.rating?' — '+(LOG_RATE[l.rating]||'').replace(/^\S+\s/,'').toLowerCase():''}${(l.tags||[]).length?' ('+l.tags.join(', ').toLowerCase()+')':''}`)).slice(0,12);
  return `Traveller: ${p.name||'the user'}, based in ${p.home||'the UK'}. Enjoys: ${p.styles.join(', ')||'not stated'}. Accommodation preference: ${p.stay}. Languages: ${langs||'English'}. Countries already visited: ${visited().map(cName).join(', ')||'none logged'}.${fl.length?` Their airline and airport ratings: ${fl.join('; ')}.`:''}`;}
function ctxTrip(t){
  return `Today is ${today()}.
${ctxProfile()}
TRIP
- Destination: ${t.dest}${t.country?` (${cName(t.country)})`:''}
- Dates: ${t.datesKnown&&t.from?`${t.from} to ${t.to||t.from} (${daysBetween(t.from,t.to||t.from)+1} days)`:`not decided${t.season?` — thinking ${t.season}`:''}`}
- Who: ${t.who}, ${Number(t.adults)||0} adults${Number(t.kids)?`, ${t.kids} children`:''}
- Occasion: ${t.occasion||'None'}
- Main reason: ${t.main} (plan around this)
- Extras: ${(t.extras||[]).filter(x=>x!==t.main).join(', ')||'none'} (fit these in, don't plan around them)
- Budget: ${t.budget}${t.budgetAmount?` (about £${t.budgetAmount} total)`:''}
- Accommodation preference: ${t.stay}
- Travelling from: ${t.origin||S.profile.home||'UK'}
- Staying at: ${t.base&&(t.base.name||t.base.area||t.base.link)?[t.base.name,t.base.area,t.base.link].filter(Boolean).join(' — '):'not booked yet'}
- Specific plans: ${t.event||'none'}
- Airport lounge: ${t.travelExtras&&t.travelExtras.lounge?t.travelExtras.lounge:'not decided'}
- Airport parking: ${t.travelExtras&&t.travelExtras.parking?t.travelExtras.parking:'not decided'}
- Notes: ${t.notes||'none'}${priorLogs(t)}`;
}
function priorLogs(t){if(!t.country)return '';const p=S.trips.filter(x=>x.id!==t.id&&x.country===t.country).flatMap(x=>x.log.map(l=>`${l.name} (${x.dest}, ${l.type.toLowerCase()}${l.rating?', '+(LOG_RATE[l.rating]||'').replace(/^\S+\s/,'').toLowerCase():''})`)).slice(0,20);
  return p.length?`\n- Places they've already been in ${cName(t.country)} and what they thought (use this to judge their taste; don't just repeat them): ${p.join('; ')}`:'';}
function ctxBookings(t){return t.bookings.length?'\nBOOKINGS\n'+t.bookings.map(b=>`- ${b.type}: ${b.title}${b.start?`, ${b.start}${b.time?' '+b.time:''}`:''}${b.end?` to ${b.end}`:''}${b.address?`, at ${b.address}`:''}${b.cost!==''&&b.cost!=null?`, ${money(b.cost,b.currency)}`:''}${b.cancelBy?`, free cancellation until ${b.cancelBy}`:''}${b.notes?` (${b.notes})`:''}`).join('\n'):'\nBOOKINGS: none added yet';}
function ctxPlan(t){if(!t.plan)return '';return '\nCURRENT PLAN HIGHLIGHTS\n'+t.plan.sections.map(s=>`${SEC[s.key]?.t||s.key}: ${(s.items||[]).map(i=>i.title).join('; ')}`).join('\n')+(t.saved.length?'\nSAVED: '+t.saved.map(s=>`${s.title}${s.state?` (${LOOP_RATE[s.state]}${s.review?': '+s.review:''})`:''}`).join('; '):'');}
function planKeys(t){const k=baseQ(t)?['stay','travel','food']:['stay','type','travel','food'];if(t.main==='Nightlife'||(t.extras||[]).includes('Nightlife'))k.push('nightlife');k.push('todo','around','watch');if(!(t.datesKnown&&t.from))k.unshift('timing');return k;}

function planPrompt(keys,t){const b=baseQ(t);

{"summary":"one sentence on the overall approach for this traveller","sections":[{"key":"${keys[0]}","items":[{"title":"short headline","detail":"2-3 sentences, specific","why":"one sentence on why it suits this traveller/trip","place":"specific place or area name, or empty"${b?',"getting":"how far from where they are staying and how to get there, e.g. \\"10 min walk\\" or \\"25 min: bus C30, then 5 min walk\\" — empty if not a fixed place"':''}}]}]}
Include exactly these section keys, in this order: ${keys.join(', ')}.
${keys.map(k=>`- ${k}: ${guide(k)}`).join('\n')}
Keep strings concise. Prices in GBP.${b?` Distances and times are from "${b}" — give your best estimate and keep "getting" under 12 words.`:''}`;}
async function callApi(body,retry=true){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.apiKey.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  if(r.status===429&&retry){const ra=Number(r.headers.get('retry-after'))||12;await new Promise(z=>setTimeout(z,Math.min(ra,30)*1000));return callApi(body,false);}
  if(!r.ok){let msg='';try{const j=await r.json();msg=j.error&&j.error.message||'';}catch(_){}const e=new Error(apiMsg(r.status,msg));e.status=r.status;e.raw=msg;throw e;}
  return r.json();
}
function apiMsg(s,m){if(s===401)return 'Your API key wasn\'t accepted — check it in Settings.';if(s===403)return 'Your API key doesn\'t have access to this — check your Anthropic account.';if(s===429)return 'Too many requests right now — wait a minute and try again.';if(s===529||s===503)return 'Claude is busy — try again in a moment.';if(s===400&&/credit|balance/i.test(m))return 'Your Anthropic account is out of credit — top up at console.anthropic.com.';return `Something went wrong (${s})${m?': '+m:''}`;}
async function ai({prompt,maxTokens=3000,search=false}){
  if(!S.settings.apiKey.trim())throw new Error('NO_KEY');
  if(!navigator.onLine)throw new Error('You\'re offline — AI needs a connection.');
  const useSearch=search&&S.settings.webSearch;
  const body={model:S.settings.model||'claude-sonnet-5',max_tokens:maxTokens,system:SYS,messages:[{role:'user',content:prompt}]};
  if(useSearch)body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:2}];
  let j;
  try{j=await callApi(body);}
  catch(e){if(useSearch&&e.status===400&&!/credit|balance/i.test(e.raw||'')){delete body.tools;j=await callApi(body);}else throw e;}
  let text='',cites=[],content=[...(j.content||[])],guard=0;
  while(j.stop_reason==='pause_turn'&&guard++<3){body.messages=[{role:'user',content:prompt},{role:'assistant',content:j.content}];j=await callApi(body);content.push(...(j.content||[]));}
  for(const b of content)if(b.type==='text'){text+=b.text;for(const c of b.citations||[])if(c.url)cites.push({url:c.url,title:c.title||c.url});}
  return {text,cites:dedupe(cites)};
}

const NOTIFY_DAYS=[30,14,7,3,1,0];
function checkReminders(){
  if(!S.settings.notify)return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const td=today();let changed=false;
  for(const t of S.trips){
    if(t.kind==='past'||!t.datesKnown||!t.from||t.from<td)continue;
    const d=daysBetween(td,t.from);
    t.notifiedDays=t.notifiedDays||[];
    if(NOTIFY_DAYS.includes(d)&&!t.notifiedDays.includes(d)){
      t.notifiedDays.push(d);changed=true;
      notify(`${t.dest} — ${d===0?'today!':d===1?'tomorrow':`${d} days to go`}`,d===0?'Have a brilliant trip.':'Open Hindsight to check your plan and checklist.');
    }
    if(d<=7&&t.checklist&&t.checklist.some(i=>!i.done)&&t.checklistNotifiedAt!==td){
      t.checklistNotifiedAt=td;changed=true;
      const left=t.checklist.filter(i=>!i.done).length;
      notify(`${t.dest} checklist — ${left} thing${left===1?'':'s'} left`,'Tap to finish getting ready.');
    }
  }
  if(changed)save();
}
async function requestNotify(){
  if(!('Notification' in window)){toast('Notifications aren\'t supported in this browser');S.settings.notify=false;save();render();return;}
  if(Notification.permission==='granted'){checkReminders();return;}
  if(Notification.permission==='denied'){toast('Notifications are blocked — allow them for this app in your phone settings');S.settings.notify=false;save();render();return;}
  const p=await Notification.requestPermission();
  if(p!=='granted'){S.settings.notify=false;save();toast('Notifications need to be allowed to work');}
  else{toast('Notifications on');checkReminders();}
  render();
}

function vHome(){

}
function ciCard(c){

  if(c.k==='loop')return `<button class="nudge" data-act="openTrip" data-id="${t.id}" data-tab="saved"><span class="em">✅</span><div><b>How was ${esc(t.dest)}?</b><span>${c.n} saved place${c.n===1?'':'s'} to rate — did you go?</span></div></button>`;
  if(c.k==='log')return `<button class="nudge" data-act="logSheet" data-id="${t.id}"><span class="em">✍️</span><div><b>Back from ${esc(t.dest)}?</b><span>Add your recommendations while they're fresh.</span></div></button>`;

  if(c.k==='check')return `<button class="nudge ai" data-act="openTrip" data-id="${t.id}" data-tab="check"><span class="em">🧳</span><div><b>${esc(t.dest)} in ${daysBetween(today(),t.from)} days</b><span>Build your checklist for this trip.</span></div></button>`;

function tripCard(t){const s=status(t);const td=today();const dd=t.datesKnown&&t.from&&t.from>td?daysBetween(td,t.from):null;

function tripRow(t){return `<button class="trip-row" data-act="openTrip" data-id="${t.id}"><span class="sw" style="background:${grad(t.dest)}"></span><div><b>${esc(t.dest)}${t.kind==='past'&&t.country?` <span style="font-weight:400">${flag(t.country)}</span>`:''}</b><span>${dateLabel(t)} ·${t.log.length} place${t.log.length===1?'':'s'} logged</span></div></button>`;}

/* ---------- trip ---------- */
function vTrip(){
  const t=trip(R.id);if(!t)return `<section class="screen"><div class="empty"><b>Trip not found</b></div><div style="margin-top:12px"><button class="btn block ghost" data-act="go" data-to="home">Back to trips</button></div></section>`;
  if(t.kind==='past')return vPast(t);
  if(R.tab==='place')return vPlace(t,R.sub);
  const tab=R.tab||'plan';const s=status(t);
  const clDone=(t.checklist||[]).filter(i=>i.done).length;
  const tabs=[['plan','Plan',''],['saved','Saved',t.saved.length],['itin','Itinerary',t.itinerary?t.itinerary.days.length:''],['book','Bookings',t.bookings.length],['check','Checklist',t.checklist?`${clDone}/${t.checklist.length}`:''],['log','My recs',t.log.length]];
  const V={plan:tPlan,saved:tSaved,itin:tItin,book:tBook,check:tCheck,log:tLog};
  return `<section class="screen">
  <div class="hero" style="background:${grad(t.dest)}">
    <div class="hero-top"><button class="back light" data-act="go" data-to="home">${ICON.back}Trips</button><button class="icon-btn" data-act="tripMenu" data-id="${t.id}" aria-label="Trip options">${ICON.more}</button></div>
    <h1>${esc(t.dest)}</h1>
    <div class="meta"><span>${ICON.cal}${dateLabel(t)}</span><span>${ICON.ppl}${esc(whoLabel(t))}</span><span>${ICON.bed}${esc(t.stay)}</span></div>
    <div class="purpose"><span class="main">Main: ${esc(t.main)}</span>${(t.extras||[]).filter(x=>x!==t.main).map(x=>`<span>+ ${esc(x)}</span>`).join('')}${t.occasion&&t.occasion!=='None'?`<span>${esc(t.occasion)}</span>`:''}</div>
  </div>
  <div class="status-line"><button class="${stCls(s)}" data-act="statusSheet" data-id="${t.id}">${s}</button>${t.event?`<span>${esc(t.event)}</span>`:''}</div>
  <div class="tv-bar"><nav class="tv-nav">${tabs.map(([k,l,c])=>`<button class="${tab===k?'on':''}" data-act="tab" data-id="${t.id}" data-tab="${k}">${l}${c!==''&&c!==0?`<span class="ct">${c}</span>`:''}</button>`).join('')}</nav><button class="ask-fab" data-act="askJump" data-id="${t.id}">💬 Ask</button></div>
  ${(V[tab]||tPlan)(t)}
  </section>`;
}
function keyCard(){return `<div class="card ai-card"><span class="badge ai">AI is off</span><h3 style="margin-top:8px">Add your API key to get a plan</h3><p>Where to stay, hotel vs Airbnb, getting there, food, things to do and watch-outs — built for this trip.</p><div class="foot"><span></span><button class="btn small" data-act="go" data-to="settings">Go to Settings</button></div></div>`;}
function baseCard(t){
  const b=t.base;const q=baseQ(t);
  if(!b||!(b.name||b.area||b.link))return `<button class="nudge" data-act="baseSheet" data-id="${t.id}"><span class="em">🏠</span><div><b>Where are you staying?</b><span>Add a link or just the area — everything gets a distance and directions from there.</span></div></button>`;
  const stale=t.plan&&!t.plan.partial&&(t.plan.baseKey||'')!==q&&q;
  return `<div class="card me-card" style="margin-bottom:12px"><p class="eyebrow">Where you're staying</p><h3 style="margin-top:4px">${esc(b.name||b.area||hostOf(b.link)||'Your stay')}</h3>
    ${b.name&&b.area?`<p>${esc(b.area)}</p>`:''}${!q?`<p style="color:var(--warn)">Add the street or area to get distances.</p>`:''}
    <div class="foot"><span class="links">${ext(safeUrl(b.link),'Listing ↗')}${q?ext(mapsSearch(q),'Map ↗'):''}</span><button class="btn small ghost" data-act="baseSheet" data-id="${t.id}">Change</button></div>
    ${stale?`<p class="hint" style="margin-top:8px">Your plan was made before this was added. <button class="link" data-act="genPlan" data-id="${t.id}">Redo it with distances</button></p>`:''}</div>`;
}
function tPlan(t){
  const full=busy['plan:'+t.id];let h=baseCard(t);const secs=t.plan?t.plan.sections:[];
  h+=chatHtml(t);
  if(!S.settings.apiKey)h+=keyCard();
  else if(!t.plan||t.plan.partial)h+=`<div class="card ai-card"><span class="badge ai">${ICON.spark} AI plan</span><h3 style="margin-top:8px">Plan ${esc(t.dest)}</h3><p>Where to stay, getting there, food, things to do and watch-outs — built around ${esc(String(t.main||'this trip').toLowerCase())}. Sections appear as each one's ready.</p><button class="btn block" style="margin-top:12px" data-act="genPlan" data-id="${t.id}">Generate my plan</button></div>`;
  if(secs.length){
    const ready=secs.filter(s=>!s.loading).length;
    h+=`${full?`<div class="nudge ai"><span class="spinner dark"></span><div><b>Planning — ${ready} of ${secs.length} ready</b><span>Sections fill in below as they arrive.</span></div></div>`:''}
    ${t.plan.summary?`<div class="card ai-card"><span class="badge ai">${ICON.spark} AI suggests</span><p style="margin-top:8px;color:var(--ink)">${esc(t.plan.summary)}</p></div>`:''}
    <div class="qs">${secs.map(s=>`<button data-act="jump" data-k="${s.key}">${SEC[s.key].ic} ${SEC[s.key].t}</button>`).join('')}</div>
    ${secs.map(s=>secHtml(t,s)).join('')}
    ${t.plan.cites&&t.plan.cites.length?`<div class="section"><p class="lab">Sources the AI checked</p><div class="sources">${t.plan.cites.slice(0,10).map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>`).join('')}</div></div>`:''}
    ${t.plan.at&&!t.plan.partial&&!full?`<p class="hint" style="margin-bottom:18px">Planned ${fmtD(t.plan.at.slice(0,10))}. AI can be wrong — check prices, times and official advice before you rely on them. <button class="link" data-act="genPlan" data-id="${t.id}">Redo the whole plan</button></p>`:''}`;
  }
  return h;
}
function secHtml(t,s){const m=SEC[s.key];const b=busy['plan:'+t.id+':'+s.key];const full=busy['plan:'+t.id];
  const head=`<div class="sec-h"><h2>${m.ic} ${m.t}</h2>${s.loading?'':`<button class="mini" data-act="regen" data-id="${t.id}" data-k="${s.key}" ${b||full?'disabled':''}>${b?'<span class="spinner dark"></span>':'↻ Redo'}</button>`}</div>`;
  const q=baseQ(t);let body;let savedN=0;
  if(s.loading)body=`<div class="card ai-card"><p><span class="spinner dark"></span>&nbsp; Working on ${m.t.toLowerCase()}…</p></div>`;
  else if(s.error&&!(s.items||[]).length)body=`<div class="card"><p>This section didn't load. <button class="link" data-act="regen" data-id="${t.id}" data-k="${s.key}">Try again</button></p></div>`;
  else{
    body=(s.items||[]).map((it,i)=>{const key=s.key+'|'+it.title;const sv=t.saved.some(x=>x.key===key);
      if(sv){savedN++;return '';}
      const pl=it.place&&!['type','timing'].includes(s.key)?it.place:'';
      return `<div class="swipe"><div class="swipe-del" data-act="dismissPlanItem" data-id="${t.id}" data-k="${s.key}" data-i="${i}">Dismiss</div><div class="swipe-body"><div class="card ai-card" data-act="openSug" data-src="sec" data-id="${t.id}" data-k="${s.key}" data-i="${i}">${it.fromChat?'<span class="badge ai" style="margin-bottom:8px">From your chat</span>':''}<h3>${esc(it.title)}</h3>${it.detail?`<p>${esc(it.detail)}</p>`:''}${it.why?`<div class="why"><b>For you:</b> ${esc(it.why)}</div>`:''}
      ${it.getting?`<p class="getting">${gIcon(it.getting)} ${esc(it.getting)} <span class="hint">from your stay · estimate</span></p>`:''}
      <div class="foot"><span class="links">${pl?ext(mapsSearch(placeQ(t,pl)),'📍 '+esc(pl)+' ↗'):''}${pl&&q&&s.key!=='stay'?ext(mapsDir(q,placeQ(t,pl)),'Directions ↗'):''}</span><button class="btn small outline" data-act="saveAi" data-id="${t.id}" data-k="${s.key}" data-i="${i}">Save</button></div></div></div></div>`;}).join('');
    if(savedN)body=`<p class="hint" style="margin-bottom:10px">${savedN} saved to Saved — <button class="link" data-act="go" data-to="trip/${t.id}/saved">view</button></p>`+body;

  bestTime:el=>{const w=S.wishlist.find(x=>x.id===el.dataset.w);if(w)bestTime(w);},
  planWish:el=>{const w=S.wishlist.find(x=>x.id===el.dataset.w);const map={Food:'Food & drink',Football:'Sport & events',Culture:'Sightseeing',Nightlife:'Nightlife',Beach:'Relaxing',Nature:'Adventure',Family:'Family time',Romance:'Romance',Adventure:'Adventure'};
    newTripDraft({dest:w.place,country:guessCountry(w.place),datesKnown:false,main:map[(w.why||[])[0]]||'Sightseeing',extras:(w.why||[]).slice(1).map(x=>map[x]).filter(Boolean),event:w.note||''});nav('new');},

  addPlace:el=>{const c=el.dataset.c;const city=String(el.dataset.city||D.place.q||'').trim();if(!city)return toast('Type or pick a place');
    if(S.trips.some(t=>t.country===c&&t.kind==='past'&&t.dest.toLowerCase()===city.toLowerCase())&&!confirm(`You've already added ${city}. Add another trip there?`))return;
    S.countries[c]=S.countries[c]||{};S.trips.push(pastTrip(c,city));D.place.q='';save();render();toast(`${city} added — tap it to add your recs`);},
  planIn:el=>{newTripDraft({dest:'',country:el.dataset.c,countryAuto:false});nav('new');},
  rmCountry:el=>{const c=el.dataset.c;const ps=S.trips.filter(t=>t.country===c&&t.kind==='past');
    if(!confirm(ps.length?`Remove ${cName(c)} and the ${ps.length} place${ps.length===1?'':'s'} you added (with their recs and photos)?`:`Remove ${cName(c)}?`))return;
    for(const t of ps)dropPhotos(t.log.flatMap(l=>l.photos||[]));S.trips=S.trips.filter(t=>!ps.includes(t));delete S.countries[c];save();nav('me');},
  pastSheet:el=>{const t=trip(el.dataset.id);D.past={id:t.id,dest:t.dest,when:t.when||'',whenText:t.whenText||'',nights:t.nights||'',who:t.who||'',notes:t.notes||''};openSheet(pastSheetR);},
  pastFromMenu:()=>{const id=D.cv.trip;closeSheet();A.pastSheet({dataset:{id}});},
  savePast:()=>{const p=D.past;const t=trip(p.id);if(!String(p.dest||'').trim())return toast('Add the place name');
    Object.assign(t,{dest:p.dest.trim(),when:p.when||'',nights:p.nights||'',who:p.who||'',notes:(p.notes||'').trim()});if(p.when)t.whenText='';
    if(t.who==='Solo'){t.adults=1;t.kids=0;}save();closeSheet();render();toast('Saved');},
  planReturn:()=>{const t=trip(D.cv.trip);closeSheet();newTripDraft({dest:t.dest,country:t.country,countryAuto:false});nav('new');},

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e);}});
let SWP=null;
document.addEventListener('touchstart',e=>{
  const el=e.target.closest('.swipe-body');
  document.querySelectorAll('.swipe-body.open').forEach(x=>{if(x!==el){x.classList.remove('open','anim');x.style.transform='';}});
  if(!el)return;
  if(el.classList.contains('open')){el.classList.add('anim');el.classList.remove('open');el.style.transform='';SWP=null;return;}
  SWP={el,startX:e.touches[0].clientX,dx:0};el.classList.remove('anim');
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!SWP)return;
  const dx=e.touches[0].clientX-SWP.startX;
  if(dx>4){SWP=null;return;}
  SWP.dx=dx;SWP.el.style.transform=`translateX(${Math.max(dx,-96)}px)`;
},{passive:true});
document.addEventListener('touchend',()=>{
  if(!SWP)return;const {el,dx}=SWP;el.classList.add('anim');
  if(dx<-56){el.style.transform='translateX(-96px)';el.classList.add('open');}
  else{el.style.transform='';el.classList.remove('open');}
  SWP=null;
});
$('#file-photos').addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length)return;toast('Adding photos…');const ids=await storePhotos(files);D.log.photos.push(...ids);D.log.newPhotos.push(...ids);drawSheet();});
$('#file-import').addEventListener('change',e=>{const f=e.target.files[0];if(f)importData(f);});

/* ================= share / backup ================= */
async function share(text,title){if(navigator.share){try{await navigator.share({title,text});return;}catch(e){if(e.name==='AbortError')return;}}copy(text);}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied — paste it into your group chat');}catch(_){window.prompt('Copy this:',text);}}
const recText=l=>`${LOG_IC[l.type]||'•'} ${l.name}${l.rating?` — ${LOG_RATE[l.rating].replace(/^\S+\s/,'')}`:''}${(l.tags||[]).length?` (${l.tags.join(', ')})`:''}${l.note?`\n   ${l.note}`:''}${l.cost!==''&&l.cost!=null?`\n   Cost: ${money(l.cost,l.currency)}${l.per==='pp'?' pp':''}`:''}${l.link?`\n   ${l.link}`:''}`;
function shareRecs(t){if(!t)return;if(!t.log.length)return toast('Log some places first');
  const txt=`My tips for ${t.dest}${t.datesKnown&&t.from?` (${fmtRange(t.from,t.to)})`:''}:\n\n`+t.log.map(recText).join('\n\n');
  share(txt,'Tips for '+t.dest);}
function shareOneRec(t,l){if(!t||!l)return;
  const txt=`My tip for ${t.dest} — ${l.name}:\n\n`+recText(l);
  share(txt,l.name);}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
async function exportData(){
  toast('Preparing backup…');
  const photos={};if(DB.db){for(const [k,b] of await DB.entries('photos'))photos[k]=await blobToData(b);}
  const data={app:'hindsight',version:1,exported:new Date().toISOString(),state:{...S,settings:{...S.settings,apiKey:''}},photos};
  const name=`hindsight-backup-${today()}.json`;const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  let done=false;
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Hindsight backup'});done=true;}catch(e){if(e.name==='AbortError')return;}}
  if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
  S.settings.lastExport=today();save();render();toast('Backup saved');
}
async function importData(file){
  try{const data=JSON.parse(await file.text());if(!['wayfarer','hindsight'].includes(data.app)||!data.state)throw new Error('That isn\'t a Hindsight backup');
    if(!confirm(`Restore the backup from ${String(data.exported||'').slice(0,10)}? It replaces what's on this phone (your API key is kept).`))return;
    const key=S.settings.apiKey;
    if(DB.db){await DB.clear('photos');for(const [k,u] of Object.entries(data.photos||{})){const b=await (await fetch(u)).blob();await DB.put('photos',k,b);}}
    for(const k of Object.keys(purl)){URL.revokeObjectURL(purl[k]);delete purl[k];}
    S=normalize(data.state);S.settings.apiKey=key;S.profile.onboarded=true;await save(true);nav('home');toast('Backup restored');
  }catch(e){toast(e.message||'Could not read that file');}
}

/* ================= toast + boot ================= */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
(async function boot(){
  await load();parse();render();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.addEventListener('online',()=>render());
  checkReminders();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkReminders();});
})();
</script>
